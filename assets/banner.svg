<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Aymane Aboulhouda, AI and Big Data Engineer">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.25"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1210"/>
      <stop offset="1" stop-color="#050807"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="219" fill="none" stroke="#1a2e26"/>

  <g font-family="'JetBrains Mono','Fira Code','Courier New',monospace">
    <text x="40" y="48" fill="#4d6b5e" font-size="14">~/aymane</text>

    <!-- subtle chromatic offset, glitches briefly every few seconds -->
    <text x="39" y="112" font-size="50" font-weight="700" fill="#00d1e0" opacity="0.45" letter-spacing="2">Aymane Aboulhouda
      <animate attributeName="x" values="39;39;35;42;39;39" keyTimes="0;0.9;0.92;0.94;0.96;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="41" y="112" font-size="50" font-weight="700" fill="#e04dbb" opacity="0.4" letter-spacing="2">Aymane Aboulhouda
      <animate attributeName="x" values="41;41;45;38;41;41" keyTimes="0;0.9;0.92;0.94;0.96;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="112" font-size="50" font-weight="700" fill="#e6f2ec" letter-spacing="2">Aymane Aboulhouda</text>

    <text x="40" y="156" fill="#5fd4a0" font-size="19">AI &amp; Big Data Engineer</text>
    <rect x="318" y="141" width="10" height="18" fill="#5fd4a0">
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="40" y="186" fill="#7f958b" font-size="14">M.Sc. Computer Science (AI &amp; Data Science) · Université de Sherbrooke</text>
  </g>

  <rect width="900" height="220" fill="url(#scan)"/>
</svg>
