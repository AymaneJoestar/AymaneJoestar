<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Aymane Aboulhouda, AI and Big Data Engineer">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.45"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a130e"/>
      <stop offset="1" stop-color="#030504"/>
    </linearGradient>
    <clipPath id="sliceA">
      <rect x="0" y="70" width="900" height="16">
        <animate attributeName="y" values="70;112;60;96;78;70" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="3.7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="sliceB">
      <rect x="0" y="100" width="900" height="10">
        <animate attributeName="y" values="100;64;118;84;100" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="2.3s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="240" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="239" fill="none" stroke="#14382a"/>

  <g font-family="'JetBrains Mono','Fira Code','Courier New',monospace">
    <text x="40" y="42" fill="#3f7a5c" font-size="13" letter-spacing="1">[ node: rabat -&gt; sherbrooke ]   [ link: stable ]   [ signal: 98% ]</text>

    <!-- RGB split layers -->
    <text x="37" y="120" font-size="52" font-weight="700" fill="#00e5ff" opacity="0.8" letter-spacing="2">AYMANE ABOULHOUDA
      <animate attributeName="x" values="37;33;41;37;36;37" keyTimes="0;0.1;0.2;0.3;0.31;1" calcMode="discrete" dur="4.1s" repeatCount="indefinite"/>
    </text>
    <text x="43" y="120" font-size="52" font-weight="700" fill="#ff2bd6" opacity="0.75" letter-spacing="2">AYMANE ABOULHOUDA
      <animate attributeName="x" values="43;47;39;43;44;43" keyTimes="0;0.1;0.2;0.3;0.31;1" calcMode="discrete" dur="4.1s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="120" font-size="52" font-weight="700" fill="#d9ffee" letter-spacing="2">AYMANE ABOULHOUDA</text>

    <!-- sliced glitch bands -->
    <g clip-path="url(#sliceA)">
      <text x="62" y="120" font-size="52" font-weight="700" fill="#00ff9c" letter-spacing="2">AYMANE ABOULHOUDA</text>
    </g>
    <g clip-path="url(#sliceB)">
      <text x="18" y="120" font-size="52" font-weight="700" fill="#ff2bd6" letter-spacing="2">AYMANE ABOULHOUDA</text>
    </g>

    <text x="40" y="168" fill="#00ff9c" font-size="20" letter-spacing="1">&gt; AI &amp; BIG DATA ENGINEER</text>
    <rect x="352" y="152" width="11" height="19" fill="#00ff9c">
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
    </rect>

    <text x="40" y="196" fill="#7fa392" font-size="14">M.Sc. Computer Science (AI / Data Science) // Université de Sherbrooke</text>
    <text x="40" y="222" fill="#1f5a3d" font-size="12" letter-spacing="2">░▒▓█▓▒░  distributed systems · computer vision · applied genai  ░▒▓█▓▒░</text>
  </g>

  <rect width="900" height="240" fill="url(#scan)"/>
  <rect width="900" height="240" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;0.05;0;0;0.03;0" keyTimes="0;0.6;0.62;0.64;0.9;0.92;1" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
